name: Android APK (Anchor)

# Baut eine installierbare Android-APK OHNE EAS — via `expo prebuild` + Gradle.
# Auslösen: Actions-Tab -> "Android APK (Anchor)" -> "Run workflow" (workflow_dispatch),
# oder Push eines Tags `mobile-v*`. Die APK liegt danach unter "Artifacts" zum Download.
#
# Env (öffentlich, client-seitig): standardmäßig auf die Live-Instanz gesetzt.
# Überschreibbar über Repository Variables (Settings -> Secrets and variables -> Actions -> Variables).

on:
  workflow_dispatch:
  push:
    tags:
      - "mobile-v*"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://anchor-api.kek95.duckdns.org' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg3NDk3NjM1LCJleHAiOjIxMDI4NTc2MzV9.M_LaWTd9tQrD7SRUAhIzfRBF1EQy4PFtNUGFIUyb4kQ' }}
      EXPO_PUBLIC_WEB_BASE_URL: ${{ vars.EXPO_PUBLIC_WEB_BASE_URL || 'https://anchor.kek95.duckdns.org' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Expo prebuild (android)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anchor-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
